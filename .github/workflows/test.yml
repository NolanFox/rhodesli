name: Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pytest pytest-xdist pytest-timeout ruff
      - name: Lint
        run: |
          source venv/bin/activate
          ruff check app/ core/ tests/
      - name: Run fast tests
        run: |
          source venv/bin/activate
          make test-fast

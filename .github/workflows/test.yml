name: Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Supabase + Gemini secrets — paste these in GitHub Settings → Secrets:
      # SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
      # SUPABASE_DB_PASSWORD, GEMINI_API_KEY.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pytest pytest-xdist pytest-timeout ruff
      - name: Lint
        run: |
          source venv/bin/activate
          ruff check app/ core/ tests/ rhodesli_ml/
      - name: Run fast tests
        run: |
          source venv/bin/activate
          make test-fast
      - name: Run ML tests
        # CI installs requirements.txt only (no torch/mlflow/…). Heavy-dep modules
        # must importorskip so they skip here. Before adding an ML test, verify
        # CI-safety locally: `python scripts/check_ml_suite_ci_safe.py` (Session 168).
        run: |
          source venv/bin/activate
          pytest rhodesli_ml/tests/ -q
